[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/scttymn/aro"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
nix = { version = "0.29", features = ["sched", "mount", "fs", "process", "signal", "user", "socket", "hostname", "poll"] }
libc = "0.2"
rsbinder = { version = "0.10", default-features = false, features = ["android_16"] }
log = "0.4"
env_logger = "0.11"

[patch.crates-io]
rsbinder = { path = "third_party/rsbinder" }
